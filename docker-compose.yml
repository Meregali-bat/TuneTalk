services:
  db:
    image: postgres:16
    container_name: tunetalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tunetalk}
      POSTGRES_PASSWORD: ${DB_PASS:-tunetalk}
      POSTGRES_DB: ${DB_NAME:-tunetalk}
    ports:
      - "5432:5432"
    volumes:
      - tunetalk-pgdata:/var/lib/postgresql/data

volumes:
  tunetalk-pgdata:
